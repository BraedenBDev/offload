name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - run: swift build -c release
      - run: swift test
      - run: .build/release/offload version
      - run: python3 -m py_compile benchmarks/run.py
      - run: make check-bundle
      - run: sh -n install.sh
